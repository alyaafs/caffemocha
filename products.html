<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Mocha Caffe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Mocha Caffe</h3>
    <button class="btn btn-dark position-relative" id="cart-btn">
      Cart
      <span id="cart-count" class="badge bg-danger position-absolute top-0 start-100 translate-middle">0</span>
    </button>
  </div>

  <div class="container">
    <div class="row">

      <!-- Mocha Latte -->
      <div class="col-md-4 mb-4">
        <div class="card p-3 shadow-sm">
          <h5>Mocha Latte</h5>
          <p>Rp22.000</p>

          <label class="form-label">Varian</label>
          <select id="variant-1" class="form-select">
            <option value="Hot">Hot</option>
            <option value="Cold">Cold</option>
          </select>

          <button class="btn btn-dark mt-3" onclick="addToCart('Mocha Latte', 22000, 'variant-1')">
            Add to Cart
          </button>
        </div>
      </div>

      <!-- Caramel Creamy Latte -->
      <div class="col-md-4 mb-4">
        <div class="card p-3 shadow-sm">
          <h5>Caramel Creamy Latte</h5>
          <p>Rp24.000</p>

          <label class="form-label">Varian</label>
          <select id="variant-2" class="form-select">
            <option value="Hot">Hot</option>
            <option value="Cold">Cold</option>
          </select>

          <button class="btn btn-dark mt-3" onclick="addToCart('Caramel Creamy Latte', 24000, 'variant-2')">
            Add to Cart
          </button>
        </div>
      </div>

      <!-- Cookies & Cream Coffee -->
      <div class="col-md-4 mb-4">
        <div class="card p-3 shadow-sm">
          <h5>Cookies & Cream Coffee</h5>
          <p>Rp26.000</p>
          <p class="text-muted">Varian: Cold Only</p>

          <button class="btn btn-dark mt-3" onclick="addToCart('Cookies & Cream Coffee', 26000, null, 'Cold')">
            Add to Cart
          </button>
        </div>
      </div>

      <!-- Iced Coffee Gula Aren -->
      <div class="col-md-4 mb-4">
        <div class="card p-3 shadow-sm">
          <h5>Iced Coffee Gula Aren</h5>
          <p>Rp20.000</p>
          <p class="text-muted">Varian: Cold Only</p>

          <button class="btn btn-dark mt-3" onclick="addToCart('Iced Coffee Gula Aren', 20000, null, 'Cold')">
            Add to Cart
          </button>
        </div>
      </div>

      <!-- Iced Mocha Frappe -->
      <div class="col-md-4 mb-4">
        <div class="card p-3 shadow-sm">
          <h5>Iced Mocha Frappe</h5>
          <p>Rp25.000</p>
          <p class="text-muted">Varian: Cold Only</p>

          <button class="btn btn-dark mt-3" onclick="addToCart('Iced Mocha Frappe', 25000, null, 'Cold')">
            Add to Cart
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- CART MODAL -->
  <div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content p-2">
        <div class="modal-header">
          <h5>Keranjang</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="cartItems"></div>
          <h5 id="cartTotal" class="mt-3"></h5>
        </div>
        <div class="modal-footer">
          <button class="btn btn-dark" id="checkoutBtn">Checkout</button>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];

function updateCartDisplay() {
  const cartCount = document.getElementById("cart-count");
  const cartItems = document.getElementById("cartItems");
  const cartTotal = document.getElementById("cartTotal");

  cartItems.innerHTML = "";
  let total = 0;
  let totalItems = 0;

  cart.forEach((item, index) => {
    const itemTotal = item.price * item.quantity;
    total += itemTotal;
    totalItems += item.quantity;

    cartItems.innerHTML += `
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span>${item.name} ${item.variant ? '(' + item.variant + ')' : ''} x${item.quantity}</span>
        <div>
          <span>Rp${itemTotal.toLocaleString("id-ID")}</span>
          <button class="btn btn-sm btn-outline-danger ms-2" onclick="removeItem(${index})">x</button>
        </div>
      </div>
    `;
  });

  cartCount.textContent = totalItems;
  cartTotal.textContent = `Total: Rp${total.toLocaleString("id-ID")}`;
  localStorage.setItem('cart', JSON.stringify(cart));
}

function removeItem(index) {
  cart.splice(index, 1);
  updateCartDisplay();
}

function addToCart(name, price, variantSelectId, fixedVariant = null) {
  const variant = fixedVariant || document.getElementById(variantSelectId).value;

  const existingItem = cart.find(item => item.name === name && item.variant === variant);

  if (existingItem) {
    existingItem.quantity += 1;
  } else {
    cart.push({ name, price, variant, quantity: 1 });
  }

  updateCartDisplay();
}

document.getElementById("checkoutBtn").addEventListener("click", () => {
  if (cart.length === 0) return alert("Keranjang kosong.");
  alert("Pesanan diproses.");
  cart = [];
  localStorage.removeItem('cart');
  updateCartDisplay();
  bootstrap.Modal.getInstance(document.getElementById("cartModal")).hide();
});

document.getElementById("cart-btn").addEventListener("click", () => {
  new bootstrap.Modal(document.getElementById("cartModal")).show();
});

updateCartDisplay();
</script>

</body>
</html>
